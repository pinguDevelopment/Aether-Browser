name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Package
        run: npm run dist -- --publish never
        env:
          # No Apple/Windows certificates yet: macOS gets an ad-hoc signature (identity "-"),
          # which Apple Silicon requires; otherwise macOS reports the app as "damaged".
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: |
          for app in release/mac*/Aether.app; do
            echo "Checking $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|Format'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
