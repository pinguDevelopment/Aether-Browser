name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub-Release für die Version aus package.json erstellen'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Package
        run: npm run dist -- --publish never
        env:
          # No Apple/Windows certificates yet: macOS gets an ad-hoc signature (identity "-"),
          # which Apple Silicon requires; otherwise macOS reports the app as "damaged".
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: |
          for app in release/mac*/*.app; do
            echo "Checking $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|Format'
          done
      # One download per platform/architecture, so nobody has to fetch installers they don't need.
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: aether-windows
          path: release/*.exe
          if-no-files-found: error
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: aether-mac-apple-silicon
          path: release/*-arm64.dmg
          if-no-files-found: error
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: aether-mac-intel
          path: release/*-x64.dmg
          if-no-files-found: error

  release:
    # Publish a GitHub release with all installers: push a tag like v0.1.0,
    # or run the workflow manually with "release" checked (tag = version from package.json).
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Downloads

          | System | Datei |
          | --- | --- |
          | Windows | `Aether-Browser-*-win-x64.exe` |
          | macOS (Apple Silicon, M1–M4) | `Aether-Browser-*-mac-arm64.dmg` |
          | macOS (Intel) | `Aether-Browser-*-mac-x64.dmg` |
          | Linux | `.AppImage` (alle Distributionen) oder `.deb` (Debian/Ubuntu) |

          Die Installer sind noch nicht mit einem Entwicklerzertifikat signiert:
          - **Windows:** bei „Der Computer wurde durch Windows geschützt“ auf *Weitere Informationen → Trotzdem ausführen* klicken.
          - **macOS:** beim ersten Start *Systemeinstellungen → Datenschutz & Sicherheit → Dennoch öffnen*. Alternativ im Terminal: `xattr -cr "/Applications/Aether Browser.app"`
          - **Linux (AppImage):** Datei ausführbar machen (`chmod +x`) und starten.
          NOTES
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./package.json').version")"; fi
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Aether Browser $TAG" \
            --notes-file notes.md
